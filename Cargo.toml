[workspace]
members = [".", "src-tauri"]
resolver = "2"

[package]
name = "cco"
version = "0.1.0"
edition = "2021"
description = "CLI orchestrator for agent CLIs (Claude first; multi-provider ready)"
license = "MIT"
readme = "README.md"
authors = ["cco"]
repository = ""

[[bin]]
name = "cco"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
which = "7"
regex = "1"
ratatui = "0.29"
crossterm = "0.28"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
