[workspace]
members = [".", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

# 防逆向主力 = strip + LTO fat + codegen-units=1（符号/内联层已去除）。
# 不用 panic="abort"：本 crate 有大量 unwrap + spawn_blocking，abort 会把单条
# Tauri 命令的 panic 放大成整个 app 无提示闪退；unwind 对逆向难度影响可忽略。
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
debug = false
overflow-checks = false

[package]
name = "cco"
version = "0.1.0"
edition = "2021"
description = "CLI orchestrator for agent CLIs (Claude first; multi-provider ready)"
license = "MIT"
readme = "README.md"
authors = ["cco"]
repository = ""

[[bin]]
name = "cco"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
which = "7"
regex = "1"
ratatui = "0.29"
crossterm = "0.28"
reqwest = { version = "0.13.4", features = ["json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"            # B3: session-digest compression event hash (dedup/match, not crypto)
# P3: Lightweight memory system dependencies
ort = "2.0.0-rc.13"      # ONNX Runtime for embedding (latest stable RC)
tantivy = "0.22"         # Full-text search (BM25)
hnsw = { version = "0.11", optional = true }  # Vector index (optional for P4)
tokenizers = "0.20"      # HuggingFace tokenizers for BERT/Sentence-BERT

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
