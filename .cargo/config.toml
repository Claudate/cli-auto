# Windows MSVC: force the static C runtime (+crt-static).
# ort (ONNX Runtime, embeddings) ships prebuilt Windows libs built against the
# static CRT (/MT → libcpmt.lib). Rust defaults to the dynamic CRT (/MD →
# msvcprt.lib), which collides at link time (LNK2005 / LNK1169 multiply defined
# symbols). Aligning Rust to the static CRT matches the ONNX libs and links a
# self-contained binary (no external vcruntime DLL needed). Windows-only —
# macOS/Linux builds are unaffected.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
