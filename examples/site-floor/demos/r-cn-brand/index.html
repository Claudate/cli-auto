<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>青瓷记 · r-cn-brand</title>
  <meta name="description" content="cco site-floor demo · R-cn-brand · story + cn-ink kit" />
  <link rel="stylesheet" href="../../shared/base.css" />
  <link rel="stylesheet" href="../../kits/cn-ink.css" />
  <link rel="stylesheet" href="../../shells/story/shell.css" />
</head>
<body data-recipe="r-cn-brand" data-kit="cn-ink">

  <header class="site-header"><div class="container inner">
    <a class="brand" href="#">青瓷记</a>
    <a class="btn btn-primary" href="#cta">预约品鉴</a>
  </div></header>

  <section class="story-hero">
    <div>
      <p class="eyebrow">国风品牌</p>
      <h1>一盏青瓷，半席茶事</h1>
      <p class="lead">茶文旅叙事用章节，不堆 SaaS 三卡片。标题可宋体短句；正文与按钮用可读黑体。</p>
      <a class="btn btn-primary" href="#cta">预约品鉴</a>
    </div>
  </section>

  <section class="container chapter">
    <div class="chapter-copy">
      <h2>一、窑火与釉色</h2>
      <p>从选泥到开窑，每一道工序写进章节。插图位上线前换成与 cn-ink 同色温的器物与实景图，不配赛博霓虹。</p>
    </div>
    <div class="visual-slot" role="img" aria-label="青瓷器物示意（实现时换实景或生成图）">青瓷器物示意</div>
  </section>

  <section class="container chapter reverse">
    <div class="chapter-copy">
      <h2>二、席间可约</h2>
      <p>周末品鉴席限八人。主路径只有「预约品鉴」；转化带与页脚分色，页脚不放大注册钮。</p>
    </div>
    <div class="visual-slot" role="img" aria-label="茶席现场示意（实现时换实景或生成图）">茶席现场示意</div>
  </section>

  <section class="cta-band" id="cta">
    <div class="container">
      <h2>下一席，等你来</h2>
      <p>写清人数与时间窗，我们回信确认。</p>
      <a class="btn btn-primary" href="#">预约品鉴</a>
    </div>
  </section>

  <footer class="site-footer">
    <div class="container"><span class="muted">© 青瓷记 · site-floor · R-cn-brand</span></div>
  </footer>

</body>
</html>
