  <header class="site-header"><div class="container inner">

  <section class="story-hero">
    <div>
      <p class="eyebrow">日系生活</p>
      <h1>手作的温度，留在日常</h1>
      <p class="lead">匠人与器物叙事：疏密度、和色、短章节。动效默认 light 或 none，不堆科技粒子。</p>
      <a class="btn btn-primary" href="#cta">了解工房</a>
    </div>
  </section>

  <section class="container chapter">
    <div class="chapter-copy">
      <h2>一、木与布</h2>
      <p>工房在旧町屋二层。每件器物从选料到打磨都可追溯；章节左右交替，插图换成真实工坊与成片。</p>
    </div>
    <div class="visual-slot" role="img" aria-label="工坊选料示意（实现时换实景或生成图）">工坊选料示意</div>
  </section>

  <section class="container chapter reverse">
    <div class="chapter-copy">
      <h2>二、可约参观</h2>
      <p>周末开放半日参观。主按钮全站唯一「了解工房」；转化带与页脚分色，避免粘成一块。</p>
    </div>
    <div class="visual-slot" role="img" aria-label="成片器物示意（实现时换实景或生成图）">成片器物示意</div>
  </section>

  <section class="cta-band" id="cta">
    <div class="container">
      <h2>下一程，走进工房</h2>
      <p>写下期望日期，我们回信安排。</p>
      <a class="btn btn-primary" href="#">了解工房</a>
    </div>
  </section>

  <footer class="site-footer">

  </footer>
