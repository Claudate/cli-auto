<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pulse · r-android-app</title>
  <meta name="description" content="cco site-floor demo · R-android-app · app-shell-lite + material kit" />
  <link rel="stylesheet" href="../../shared/base.css" />
  <link rel="stylesheet" href="../../kits/material.css" />
  <link rel="stylesheet" href="../../shells/app-shell-lite/shell.css" />
</head>
<body data-recipe="r-android-app" data-kit="material">

  <header class="app-top">
    <a class="brand" href="#">Pulse</a>
    <a class="btn btn-primary" href="#">新建</a>
  </header>
  <div class="app-body">
    <aside class="side" aria-label="侧栏">
      <a class="active" href="#">首页</a>
      <a href="#">收藏</a>
      <a href="#">设置</a>
    </aside>
    <main class="main">
      <h1>首页</h1>
      <p class="muted">安卓 App 壳气质：Material kit + 侧栏导航；主操作右上；空 / 错态人话，无销售五段。</p>
      <div class="toolbar">
        <a class="btn btn-primary" href="#">新建条目</a>
        <a class="btn btn-ghost" href="#">同步</a>
      </div>
      <div class="empty">
        <strong>还没有条目</strong>
        点右上角新建，或从其他设备同步。
      </div>
      <div class="error-sample" role="status">同步失败：无法连接服务。请检查网络后重试。</div>
    </main>
  </div>

</body>
</html>
