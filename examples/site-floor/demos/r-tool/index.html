<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fieldkit · r-tool</title>
  <meta name="description" content="cco site-floor demo · R-tool · app-shell-lite + western-saas kit" />
  <link rel="stylesheet" href="../../shared/base.css" />
  <link rel="stylesheet" href="../../kits/western-saas.css" />
  <link rel="stylesheet" href="../../shells/app-shell-lite/shell.css" />
</head>
<body data-recipe="r-tool" data-kit="western-saas">

  <header class="app-top">
    <a class="brand" href="#">Fieldkit</a>
    <a class="btn btn-primary" href="#">新建项目</a>
  </header>
  <div class="app-body">
    <aside class="side" aria-label="侧栏">
      <a class="active" href="#">项目</a>
      <a href="#">资源</a>
      <a href="#">设置</a>
    </aside>
    <main class="main">
      <h1>项目</h1>
      <p class="muted">登录后 Web 工具下限：主操作在右上；空 / 错 / 载用人话，不用大营销图。</p>
      <div class="toolbar">
        <a class="btn btn-primary" href="#">新建项目</a>
        <a class="btn btn-ghost" href="#">导入</a>
      </div>
      <div class="empty">
        <strong>还没有项目</strong>
        创建第一个项目后，列表会出现在这里。
      </div>
      <div class="error-sample" role="status">无法保存：网络中断。请检查连接后重试。</div>
    </main>
  </div>

</body>
</html>
