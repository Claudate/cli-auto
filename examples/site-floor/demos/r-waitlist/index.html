<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Northline · r-waitlist</title>
  <meta name="description" content="cco site-floor demo · R-waitlist · waitlist + western-saas kit" />
  <link rel="stylesheet" href="../../shared/base.css" />
  <link rel="stylesheet" href="../../kits/western-saas.css" />
  <link rel="stylesheet" href="../../shells/waitlist/shell.css" />
</head>
<body data-recipe="r-waitlist" data-kit="western-saas">

  <header class="site-header"><div class="container inner">
    <a class="brand" href="#">Northline</a>
  </div></header>

  <main class="wait-main container">
    <div class="wait-card">
      <p class="eyebrow">Early access</p>
      <h1>先留下工作邮箱，公测就绪就通知你</h1>
      <p class="lead">一屏说清价值：短标题 + 唯一主按钮。生产接第三方表单即可，不必首日自建账号系统。</p>
      <form action="#" method="get" onsubmit="return false;">
        <div class="field">
          <label for="email">工作邮箱</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@company.com" required />
        </div>
        <button class="btn btn-primary" type="submit">加入候补</button>
      </form>
      <p class="fine">演示表单不提交。不收集密码；页脚不放第二颗主转化钮。</p>
    </div>
  </main>

  <footer class="site-footer">© Northline · site-floor · R-waitlist</footer>

</body>
</html>
