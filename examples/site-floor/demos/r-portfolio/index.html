<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lin Yue · r-portfolio</title>
  <meta name="description" content="cco site-floor demo · R-portfolio · portfolio + nordic kit" />
  <link rel="stylesheet" href="../../shared/base.css" />
  <link rel="stylesheet" href="../../kits/nordic.css" />
  <link rel="stylesheet" href="../../shells/portfolio/shell.css" />
</head>
<body data-recipe="r-portfolio" data-kit="nordic">

  <header class="site-header"><div class="container inner">
    <a class="brand" href="#">Lin Yue</a>
    <a class="btn btn-primary" href="#contact">联系合作</a>
  </div></header>

  <main class="container">
    <section class="intro">
      <p class="eyebrow">Portfolio</p>
      <h1>精选作品，首屏就看见</h1>
      <p>产品与品牌界面设计。首屏是作品栅格，不写两屏空口号；每格上线时换成真实项目图。</p>
    </section>
    <section class="work-grid" aria-label="作品">
      <a class="work-card" href="#">
        <div class="thumb" role="img" aria-label="北岸品牌站作品示意"></div>
        <div class="meta"><h3>北岸品牌站</h3><p>营销 · 2026</p></div>
      </a>
      <a class="work-card" href="#">
        <div class="thumb" role="img" aria-label="工具控制台作品示意"></div>
        <div class="meta"><h3>工具控制台</h3><p>产品 · 2025</p></div>
      </a>
      <a class="work-card" href="#">
        <div class="thumb" role="img" aria-label="展览视觉作品示意"></div>
        <div class="meta"><h3>展览视觉</h3><p>叙事 · 2025</p></div>
      </a>
      <a class="work-card" href="#">
        <div class="thumb" role="img" aria-label="移动购物流作品示意"></div>
        <div class="meta"><h3>移动购物流</h3><p>电商 · 2024</p></div>
      </a>
    </section>
  </main>

  <footer class="site-footer" id="contact">
    <div class="container">
      <p class="muted">合作请写清预算与时间窗 · site-floor · R-portfolio · nordic</p>
    </div>
  </footer>

</body>
</html>
