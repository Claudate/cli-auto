<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>云岚书院 · r-shanshui</title>
  <meta name="description" content="cco site-floor demo · R-shanshui · story + shanshui kit" />
  <link rel="stylesheet" href="../../shared/base.css" />

  <link rel="stylesheet" href="../../shells/story/shell.css" />
</head>
<body data-recipe="r-shanshui" data-kit="shanshui">

  <header class="site-header"><div class="container inner">
    <a class="brand" href="#">云岚书院</a>
    <a class="btn btn-primary" href="#cta">预约探访</a>
  </div></header>

  <section class="story-hero">
    <div>
      <p class="eyebrow">山水叙事</p>
      <h1>雾起时，路仍在山脊</h1>
      <p class="lead">云岚书院藏在半山云线。短标题用文楷；正文与主按钮保持可读黑体，不堆粒子与霓虹。</p>
      <a class="btn btn-primary" href="#cta">预约探访</a>
    </div>
  </section>

  <section class="container chapter">
    <div class="chapter-copy">
      <h2>一、为何上山</h2>
      <p>把行程写成左右交替的章节，而不是功能三卡片。清晨雾气压低山脊时，石阶仍能摸到；探访只约半日，不赶打卡清单。</p>
    </div>
    <div class="visual-slot" role="img" aria-label="山脊晨雾示意（实现时换实景或生成图）">山脊晨雾示意</div>
  </section>

  <section class="container chapter reverse">
    <div class="chapter-copy">
      <h2>二、抵达之后</h2>
      <p>茶室、廊桥与一间安静的阅览角。主路径只有一件事：约好时间上山。插图位上线前换成与 kit 同色温的实景图。</p>
    </div>
    <div class="visual-slot" role="img" aria-label="茶室廊桥示意（实现时换实景或生成图）">茶室廊桥示意</div>
  </section>

  <section class="cta-band" id="cta">
    <div class="container">
      <h2>下一程，一起走</h2>
      <p>转化带与页脚分色；主按钮文案全站唯一。</p>
      <a class="btn btn-primary" href="#">预约探访</a>
    </div>
  </section>

  <footer class="site-footer">
    <div class="container"><span class="muted">© 云岚书院 · site-floor · R-shanshui</span></div>
  </footer>

</body>
</html>
