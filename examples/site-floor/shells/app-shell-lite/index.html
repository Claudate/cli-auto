<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>App shell lite · cco site-floor</title>
  <meta name="description" content="cco site-floor · app-shell-lite：顶栏 + 侧栏 + 主区 + 空态/错误人话" />
  <link rel="stylesheet" href="../../shared/base.css" />
  <link rel="stylesheet" href="../../kits/western-saas.css" />
  <link rel="stylesheet" href="shell.css" />
</head>
<body data-recipe="shell-app" data-kit="western-saas">

  <!-- 顶栏：产品名 + 主操作 -->
  <header class="app-top">
    <div class="app-top-left">
      <button type="button" class="nav-toggle" aria-label="打开导航" aria-controls="side-nav" aria-expanded="false">
        <svg class="icon-line" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" />
        </svg>
      </button>
      <a class="brand" href="#">Workbench</a>
    </div>
    <div class="app-top-right">
      <span class="env-pill" title="当前环境">本地</span>
      <a class="btn btn-primary" href="#">
        <svg class="icon-line icon-on-btn" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 5v14M5 12h14" />
        </svg>
        新建
      </a>
    </div>
  </header>

  <div class="app-body">
    <!-- 侧栏：稳定导航 -->
    <aside class="side" id="side-nav" aria-label="侧栏导航">
      <p class="side-label">工作区</p>
      <a class="active" href="#">
        <svg class="icon-line" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="2" />
          <path d="M3 10h18" />
        </svg>
        项目
      </a>
      <a href="#">
        <svg class="icon-line" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3" />
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
        设置
      </a>
      <a href="#">
        <svg class="icon-line" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 8v5M12 16h.01" />
        </svg>
        帮助
      </a>
    </aside>

    <!-- 主区：一屏主任务 -->
    <main class="main">
      <div class="page-head">
        <div>
          <h1>项目</h1>
          <p class="muted page-sub">工具壳下限：主操作在右上；空态人话，不用大营销图。</p>
        </div>
        <div class="toolbar">
          <a class="btn btn-primary" href="#">
            <svg class="icon-line icon-on-btn" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5v14M5 12h14" />
            </svg>
            新建项目
          </a>
          <a class="btn btn-ghost" href="#">导入</a>
        </div>
      </div>

      <!-- 空态：人话 + 下一步 -->
      <div class="empty" role="status">
        <svg class="icon-line empty-icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="2" />
          <path d="M8 12h8M12 8v8" />
        </svg>
        <strong>还没有项目</strong>
        <p>创建第一个项目后，列表会出现在这里。也可以先导入已有目录。</p>
        <a class="btn btn-primary" href="#">创建第一个项目</a>
      </div>

      <!-- 错误人话样例（演示态） -->
      <div class="error-sample" role="alert">
        <svg class="icon-line error-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 8v5M12 16h.01" />
        </svg>
        <div>
          <strong>无法保存</strong>
          <p>网络中断。请检查连接后重试；已输入内容仍保留在本页。</p>
        </div>
      </div>
    </main>
  </div>

</body>
</html>
